[project]
name = "a11y-scanner"
version = "3.0.0"
description = "Barrierefreiheits-Scanner für Websites nach BITV 2.0 / EN 301 549 / WCAG 2.1 (Docker-First, Web-Frontend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "flake8>=7.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not integration"]
markers = [
    "integration: benötigt Playwright/Netzwerk (nicht im schnellen Unit-Lauf)",
]
